<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Трекер Аскара">
<title>Трекер Аскара</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F5F0;
    --surface: #FFFFFF;
    --surface2: #F2EDE6;
    --surface3: #EDE8E0;
    --accent: #5C7A5E;
    --accent-soft: rgba(92,122,94,0.10);
    --choco: #3D2B1F;
    --choco2: #6B4C3B;
    --choco3: #A07860;
    --text: #2C2418;
    --text2: #7A6A5A;
    --text3: #B0A090;
    --border: rgba(61,43,31,0.08);
    --border2: rgba(61,43,31,0.15);
    --done-bg: #5C7A5E;
    --done-text: #fff;
    --half-bg: #D4A85A;
    --half-text: #fff;
    --skip-bg: #EDE8E0;
    --skip-text: #B0A090;
    --radius: 14px;
    --radius-sm: 10px;
    --radius-xs: 8px;
    --warn: #B85A1A;
    --warn-bg: #FDF0E6;
    --shadow-sm: 0 2px 8px rgba(61,43,31,0.08);
    --shadow-md: 0 4px 16px rgba(61,43,31,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; padding-bottom: 60px; }

  input, select, textarea { font-size: 16px !important; }

  /* HEADER */
  .app-header {
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    padding: 20px 24px 0;
    position: sticky; top: 0; z-index: 10;
    box-shadow: var(--shadow-sm);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 16px;
  }
  .app-header h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 20px; font-weight: 600;
    color: var(--choco); letter-spacing: -0.01em;
  }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; border-radius: var(--radius-sm);
    padding: 8px 16px; font-size: 12px; font-weight: 600;
    font-family: 'Montserrat', sans-serif; letter-spacing: 0.01em;
    cursor: pointer; transition: all 0.18s; white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn:active { transform: scale(0.97); box-shadow: none; }
  .btn-export { background: var(--choco2); color: white; }
  .btn-import { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); box-shadow: none; }
  .btn-quick { background: var(--accent); color: white; }

  /* TABS */
  .tabs { display: flex; gap: 0; margin-top: 4px; }
  .tab-btn {
    flex: 1; padding: 12px 16px; border: none; background: none;
    font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.02em; text-transform: uppercase;
    color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text2); }

  /* WEEK NAV */
  .week-bar {
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 10px;
  }
  .nav-arrow {
    background: var(--surface2); border: none; border-radius: var(--radius-xs);
    width: 36px; height: 36px; cursor: pointer; font-size: 16px; color: var(--choco2);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .nav-arrow:hover { background: var(--surface3); transform: translateY(-1px); }
  .week-label {
    font-size: 13px; font-weight: 500; color: var(--text2);
    flex: 1; text-align: center; font-family: 'Inter', sans-serif;
  }
  .btn-today {
    background: var(--accent); color: white; border: none;
    border-radius: var(--radius-sm); padding: 8px 16px;
    font-size: 12px; font-weight: 600; font-family: 'Montserrat', sans-serif;
    letter-spacing: 0.02em;
    cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .btn-today:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

  /* VIEWS */
  .view { display: none; }
  .view.active { display: block; }

  /* TABLE */
  .table-scroll { overflow-x: auto; padding: 20px 20px 0; }
  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 2px;
    min-width: 520px;
  }

  thead th {
    background: var(--bg);
    font-family: 'Montserrat', sans-serif;
    font-size: 11px; font-weight: 600;
    color: var(--choco3);
    padding: 8px 10px 10px; text-align: center;
    letter-spacing: 0.04em; text-transform: uppercase;
    position: sticky; top: 0; z-index: 3;
    border-bottom: 2px solid var(--border2);
  }
  thead th.param-col {
    text-align: left; min-width: 160px; padding-left: 16px;
    position: sticky; top: 0; left: 0; z-index: 4; background: var(--bg);
  }

  tbody tr { transition: all 0.12s; }
  tbody tr:nth-child(even) td { background: var(--surface2); }
  tbody tr:nth-child(odd) td { background: var(--surface); }
  tbody tr td {
    padding: 10px 10px;
    border: none;
    vertical-align: middle;
    transition: background 0.1s;
  }
  tbody tr td:first-child { border-radius: var(--radius-xs) 0 0 var(--radius-xs); }
  tbody tr td:last-child { border-radius: 0 var(--radius-xs) var(--radius-xs) 0; }
  tbody tr:hover td { background: var(--surface3) !important; }

  td.param-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--choco); padding-left: 16px; min-width: 160px;
    position: sticky; left: 0; z-index: 1;
    box-shadow: 3px 0 8px rgba(61,43,31,0.06);
  }
  td.day-cell { text-align: center; min-width: 64px; }
  td.today-cell { background: var(--accent-soft) !important; }

  /* CHECK BUTTON */
  .check-btn {
    width: 34px; height: 34px;
    border-radius: var(--radius-xs);
    border: 1.5px solid var(--border2);
    background: var(--surface);
    cursor: pointer; font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.18s; color: var(--text3);
    box-shadow: var(--shadow-sm);
  }
  .check-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .check-btn.done {
    background: var(--done-bg); border-color: var(--done-bg);
    color: var(--done-text);
    box-shadow: 0 3px 10px rgba(92,122,94,0.35);
  }
  .check-btn.half {
    background: var(--half-bg); border-color: var(--half-bg);
    color: var(--half-text);
    box-shadow: 0 3px 10px rgba(212,168,90,0.35);
    font-size: 11px;
  }
  .check-btn.skip {
    background: var(--skip-bg); border-color: transparent;
    color: var(--skip-text); box-shadow: none;
  }

  /* NUM INPUT */
  .num-input {
    width: 54px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-xs);
    padding: 6px 4px; text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px !important;
    font-weight: 600;
    background: var(--surface2);
    color: var(--choco);
    transition: all 0.15s;
    box-shadow: inset 0 1px 3px rgba(61,43,31,0.05);
  }
  .num-input:focus {
    outline: none; border-color: var(--accent);
    background: white; box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* NOTES */
  .notes-input {
    width: 100%; border: 1.5px solid var(--border);
    border-radius: var(--radius-xs);
    padding: 6px 10px; font-family: 'Inter', sans-serif; font-size: 12px;
    background: var(--surface2); color: var(--choco); min-width: 130px;
    min-height: 64px; resize: vertical; transition: all 0.15s;
  }
  .notes-input:focus { outline: none; border-color: var(--accent); background: white; box-shadow: 0 0 0 3px var(--accent-soft); }

  /* SECTION DIVIDERS */
  .section-divider td:first-child { position: sticky; left: 0; z-index: 1; }
  .section-divider td {
    background: var(--bg) !important;
    padding: 16px 16px 4px;
    font-family: 'Montserrat', sans-serif;
    font-size: 9px; color: var(--choco3);
    text-transform: uppercase; letter-spacing: 0.10em;
    font-weight: 700; border: none;
  }

  /* PROGRESS VIEW */
  .progress-view { padding: 20px 20px; }
  .progress-view h2 {
    font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700;
    color: var(--choco); margin-bottom: 6px; letter-spacing: -0.01em;
  }
  .progress-week-label { font-size: 12px; color: var(--text3); margin-bottom: 16px; font-weight: 500; }

  .period-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .period-btn {
    padding: 9px 22px; border: 1.5px solid var(--border2); border-radius: 24px;
    background: none; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text2); cursor: pointer; transition: all 0.18s;
  }
  .period-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 12px rgba(92,122,94,0.3); }
  .period-btn:hover:not(.active) { background: var(--surface2); }

  .chart-card {
    background: var(--surface); border-radius: 20px;
    padding: 20px; margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(61,43,31,0.07);
    border: 1px solid var(--border);
  }
  .chart-card-title {
    font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700;
    color: var(--choco3); text-transform: uppercase; letter-spacing: 0.10em; margin-bottom: 16px;
  }
  .chart-metric-label {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 300;
    color: var(--choco2); margin-bottom: 6px; letter-spacing: 0.01em;
  }

  .section-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px; font-weight: 700; color: var(--choco3);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-bottom: 12px; margin-top: 4px;
  }

  .progress-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .p-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 18px 18px;
    box-shadow: 0 4px 15px rgba(61,43,31,0.05);
  }
  .p-card.full { grid-column: 1 / -1; }
  .p-title {
    font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700;
    color: var(--choco3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .p-nums { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .p-big { font-size: 26px; font-weight: 700; font-family: 'Montserrat', sans-serif; color: var(--choco); }
  .p-unit { font-size: 11px; color: var(--text3); font-weight: 400; }
  .p-sub { font-size: 11px; color: var(--text3); margin-bottom: 10px; line-height: 1.4; }
  .p-bar { background: var(--surface2); border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 5px; }
  .p-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease-in-out; background: var(--accent); }
  .p-fill.amber { background: var(--half-bg); }
  .p-fill.blue { background: #7A9FC9; }
  .p-pct { font-size: 11px; color: var(--text3); font-weight: 500; }

  .habits-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .habit-chip {
    background: var(--surface); border-radius: 20px;
    padding: 18px 16px; text-align: center;
    box-shadow: 0 4px 15px rgba(61,43,31,0.05);
    border: 1px solid var(--border);
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .habit-chip:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(61,43,31,0.09); }
  .habit-chip-icon { font-size: 24px; margin-bottom: 8px; }
  .habit-chip-label {
    font-family: 'Montserrat', sans-serif; font-size: 9px; font-weight: 700;
    color: var(--choco3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;
  }
  .habit-chip-val { font-size: 22px; font-weight: 700; font-family: 'Montserrat', sans-serif; color: var(--choco); }
  .habit-chip-sub { font-size: 10px; color: var(--text3); margin-top: 2px; }

  /* QUICK INPUT MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(61,43,31,0.45);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 20px; backdrop-filter: blur(4px);
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--surface); border-radius: var(--radius);
    width: 100%; max-width: 420px; padding: 28px 24px;
    box-shadow: 0 24px 64px rgba(61,43,31,0.22);
  }
  .modal-step { font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700; color: var(--choco3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .modal-label { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 600; color: var(--choco); margin-bottom: 20px; line-height: 1.2; letter-spacing: -0.01em; }

  .modal-check-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .modal-check-btn {
    flex: 1; min-width: 80px; padding: 14px 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--border2);
    background: var(--surface2); font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; color: var(--text2);
    box-shadow: var(--shadow-sm); text-align: center;
  }
  .modal-check-btn.selected-yes { background: var(--done-bg); border-color: var(--done-bg); color: white; box-shadow: 0 4px 12px rgba(92,122,94,0.35); }
  .modal-check-btn.selected-half { background: var(--half-bg); border-color: var(--half-bg); color: white; box-shadow: 0 4px 12px rgba(212,168,90,0.35); }
  .modal-check-btn.selected-skip { background: var(--surface3); border-color: transparent; color: var(--text3); box-shadow: none; }
  .modal-check-btn:hover:not(.selected-yes):not(.selected-half):not(.selected-skip) { border-color: var(--accent); color: var(--accent); }

  .modal-num-wrap { margin-bottom: 24px; }
  .modal-num-input {
    width: 100%; border: 1.5px solid var(--border2); border-radius: var(--radius-sm);
    padding: 12px 16px; font-size: 18px; font-family: 'Inter', sans-serif;
    background: transparent; color: var(--text); text-align: center;
    transition: border-color 0.15s;
  }
  .modal-num-input:focus { outline: none; border-color: var(--accent); }

  .modal-text-wrap { margin-bottom: 24px; }
  .modal-text-input {
    width: 100%; border: 1.5px solid var(--border2); border-radius: var(--radius-sm);
    padding: 12px 16px; font-size: 15px; font-family: 'Inter', sans-serif;
    background: transparent; color: var(--text); min-height: 80px; resize: none;
    transition: border-color 0.15s;
  }
  .modal-text-input:focus { outline: none; border-color: var(--accent); }

  /* VALUE QUESTION */
  .modal-value-q {
    background: rgba(92,122,94,0.08); border-radius: var(--radius-sm);
    padding: 14px 16px; margin-bottom: 20px;
    border-left: 3px solid var(--accent);
  }
  .modal-value-label { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; font-weight: 600; }
  .modal-value-qtext { font-size: 15px; color: var(--text); line-height: 1.6; font-style: italic; }
  .modal-value-input {
    width: 100%; border: none; border-top: 1px solid var(--border); margin-top: 12px;
    padding: 10px 0 0; font-size: 14px; font-family: 'Inter', sans-serif;
    background: transparent; color: var(--text); resize: none; min-height: 52px;
  }
  .modal-value-input:focus { outline: none; }

  .modal-progress { background: var(--surface2); border-radius: 4px; height: 4px; margin-bottom: 20px; overflow: hidden; }
  .modal-progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s ease; }

  .modal-btns { display: flex; gap: 10px; }
  .modal-btn-back {
    padding: 12px 20px; border: 1.5px solid var(--border2); border-radius: var(--radius-sm);
    background: var(--surface2); font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 600;
    color: var(--text2); cursor: pointer; transition: all 0.15s;
  }
  .modal-btn-next {
    flex: 1; padding: 12px 20px; border: none; border-radius: var(--radius-sm);
    background: var(--accent); color: white; font-family: 'Montserrat', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
    cursor: pointer; transition: all 0.15s;
    box-shadow: 0 4px 12px rgba(92,122,94,0.3);
  }
  .modal-btn-next:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(92,122,94,0.4); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: var(--choco); color: white; padding: 12px 24px;
    border-radius: 20px; font-size: 13px; font-weight: 500;
    font-family: 'Montserrat', sans-serif; letter-spacing: 0.02em;
    z-index: 200; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; white-space: nowrap;
    box-shadow: 0 8px 24px rgba(61,43,31,0.25);
  }
  .toast.show { opacity: 1; }
  #importFile { display: none; }

  /* Value question display in table */
  .value-q-display {
    font-size: 11px; color: var(--text3); font-style: italic;
    margin-bottom: 3px; min-width: 120px; line-height: 1.4;
  }
  .value-a-display { font-size: 12px; color: var(--text); line-height: 1.4; }

  @media (max-width: 700px) {
    .progress-grid { grid-template-columns: 1fr; }
    .p-card.full { grid-column: 1; }
    .header-top { flex-direction: column; align-items: flex-start; }
    .app-header, .week-bar, .progress-view { padding-left: 16px; padding-right: 16px; }
    .table-scroll { padding-left: 16px; padding-right: 16px; }
    .habits-grid { grid-template-columns: repeat(2, 1fr); }
    .header-actions { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <h1>Трекер Аскара</h1>
    <div class="header-actions">
      <button class="btn btn-quick" onclick="openQuick()">&#9654; Быстрый ввод</button>
      <button class="btn btn-export" onclick="exportData()">&#8595; Экспорт</button>
      <button class="btn btn-import" onclick="document.getElementById('importFile').click()">&#8593; Импорт</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(event)">
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tracker', this)">Трекер</button>
    <button class="tab-btn" onclick="switchTab('progress', this)">Прогресс</button>
  </div>
</div>

<div class="week-bar">
  <button class="nav-arrow" onclick="shiftWeek(-1)">&#8592;</button>
  <span class="week-label" id="weekLabel"></span>
  <button class="nav-arrow" onclick="shiftWeek(1)">&#8594;</button>
  <button class="btn-today" onclick="goToday()">Сегодня</button>
</div>

<!-- TRACKER VIEW -->
<div id="view-tracker" class="view active">
  <div class="table-scroll"><table id="trackerTable"></table></div>
</div>

<!-- PROGRESS VIEW -->
<div id="view-progress" class="view">
  <div class="progress-view">
    <h2>Прогресс</h2>
    <div class="period-tabs">
      <button class="period-btn active" onclick="switchPeriod('week', this)">Неделя</button>
      <button class="period-btn" onclick="switchPeriod('month', this)">Месяц</button>
      <button class="period-btn" onclick="switchPeriod('year', this)">Год</button>
    </div>
    <div class="progress-week-label" id="progressPeriodLabel"></div>
    <div class="chart-card">
      <div class="chart-card-title">Динамика состояния</div>
      <div id="moodChart"></div>
    </div>
    <div class="section-title">Привычки</div>
    <div class="habits-grid" id="habitsGrid"></div>
  </div>
</div>

<!-- QUICK INPUT MODAL -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <div class="modal-progress"><div class="modal-progress-fill" id="modalProgressFill"></div></div>
    <div class="modal-step" id="modalStep"></div>
    <div class="modal-label" id="modalLabel"></div>
    <div id="modalInput"></div>
    <div class="modal-btns">
      <button class="modal-btn-back" onclick="quickBack()">&#8592;</button>
      <button class="modal-btn-next" id="modalNextBtn" onclick="quickNext()">Далее</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- PARAMS ----
// check3 = три состояния: нет / наполовину / да

const DAY_NAMES = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTH_NAMES = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

let weekOffset = 0, currentTab = 'tracker', currentPeriod = 'week';
let data = {};
try { data = JSON.parse(localStorage.getItem('askarTrackerData') || '{}'); } catch(e) {}

function dateKey(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isToday(d) { return dateKey(d) === dateKey(new Date()); }

function getWeekDates(offset) {
  const today = new Date(), dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow===0?6:dow-1) + offset*7);
  return Array.from({length:7}, (_,i) => { const d=new Date(monday); d.setDate(monday.getDate()+i); return d; });
}

function getMonthDates(offset) {
  const today = new Date();
  const first = new Date(today.getFullYear(), today.getMonth()+offset, 1);
  const last  = new Date(today.getFullYear(), today.getMonth()+offset+1, 0);
  const days = [];
  for (let d=new Date(first); d<=last; d.setDate(d.getDate()+1)) days.push(new Date(d));
  return days;
}

function save() { try { localStorage.setItem('askarTrackerData', JSON.stringify(data)); } catch(e) {} }

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function exportData() {
  if (!Object.keys(data).length) { showToast('Нет данных для экспорта'); return; }
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),version:1,data},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='askar-tracker-'+dateKey(new Date())+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  showToast('Данные экспортированы');
}

function importData(event) {
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e => {
    try {
      const parsed=JSON.parse(e.target.result);
      data=Object.assign({},data,parsed.data||parsed);
      save(); render(); showToast('Данные загружены');
    } catch { showToast('Ошибка: неверный формат'); }
  };
  reader.readAsText(file); event.target.value='';
}

// check3: null → 'done' → 'half' → null (cycle: нет→да→наполовину→нет)
function toggleCheck3(key, dk) {
  if (!data[dk]) data[dk]={};
  const cur=data[dk][key];
  data[dk][key]=cur==='done'?'half':cur==='half'?null:'done';
  save(); renderTracker(getWeekDates(weekOffset));
}

// check2: null → 'done' → null
function toggleCheck2(key, dk) {
  if (!data[dk]) data[dk]={};
  data[dk][key]=data[dk][key]==='done'?null:'done';
  save(); renderTracker(getWeekDates(weekOffset));
}

function setVal(key, dk, val) {
  if (!data[dk]) data[dk]={};
  data[dk][key]=val; save();
}

function switchTab(tab, el) {
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('view-'+tab).classList.add('active');
  render();
}

function switchPeriod(period, el) {
  currentPeriod=period;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderProgress();
}

function shiftWeek(dir) { weekOffset+=dir; render(); }
function goToday() { weekOffset=0; render(); }

// Deterministic question by date
function getValueQ(dk) {
  let hash=0;
  for (let i=0;i<dk.length;i++) hash=(hash*31+dk.charCodeAt(i))>>>0;
  return VALUE_QUESTIONS[hash % VALUE_QUESTIONS.length];
}

// ---- RENDER TRACKER ----
function renderTracker(days) {
  const table=document.getElementById('trackerTable');
  let html='<thead><tr><th class="param-col">Параметр</th>';
  days.forEach(d => {
    const tc=isToday(d)?' today-cell':'';
    const bold=isToday(d)?'font-weight:600;color:#5C7A5E;':'';
    html+='<th class="'+tc+'" style="'+bold+'">'+DAY_NAMES[d.getDay()]+'<br><span style="font-size:12px;font-weight:400">'+d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')+'</span></th>';
  });
  html+='</tr></thead><tbody>';

  PARAMS.forEach(p => {
    if (p.section) { html+='<tr class="section-divider"><td colspan="8">'+p.section+'</td></tr>'; return; }
    html+='<tr><td class="param-name">'+p.label+'</td>';
    days.forEach(d => {
      const dk=dateKey(d);
      const val=data[dk]?data[dk][p.key]:null;
      const tc=isToday(d)?' today-cell':'';
      html+='<td class="day-cell'+tc+'">';

      if (p.type==='check3') {
        const state=val||'';
        const cls=state==='done'?'done':state==='half'?'half':'';
        const icon=state==='done'?'✓':state==='half'?'½':'.';
        html+='<button class="check-btn '+cls+'" onclick="toggleCheck3(\''+p.key+'\',\''+dk+'\')">'+icon+'</button>';

      } else if (p.type==='check2') {
        const state=val||'';
        const cls=state==='done'?'done':'';
        const icon=state==='done'?'✓':'.';
        html+='<button class="check-btn '+cls+'" onclick="toggleCheck2(\''+p.key+'\',\''+dk+'\')">'+icon+'</button>';

      } else if (p.type==='num') {
        const v=(val!==null&&val!==undefined&&val!=='')?val:'';
        html+='<input class="num-input" type="number" inputmode="decimal" min="0" max="'+(p.max||999)+'" step="'+(p.max===10||p.max===24?0.5:1)+'" value="'+v+'" placeholder="'+(p.placeholder||'')+'" onchange="setVal(\''+p.key+'\',\''+dk+'\',this.value)">';

      } else if (p.type==='valueq') {
        const q=getValueQ(dk);
        const stored=val||'';
        const parts=stored.split('\n---\n');
        const savedA=parts.length>1?parts[1]:'';
        if (savedA) {
          html+='<div class="value-q-display">'+q+'</div><div class="value-a-display">'+savedA+'</div>';
        } else {
          html+='<span style="color:var(--text3);font-size:12px">—</span>';
        }
      }
      html+='</td>';
    });
    html+='</tr>';
  });
  html+='</tbody>';
  table.innerHTML=html;
}

// ---- STATS ----
function getStats(days) {
  let s={
    sleepS:0,sleepC:0,chargeS:0,chargeC:0,psychS:0,psychC:0,anxS:0,anxC:0,
    foodS:0,foodC:0,rationalS:0,rationalC:0,attentionS:0,attentionC:0,
    morning:0,water:0,workout:0,baseex:0,self:0,network:0,mindful:0,planning:0,
    lateeat:0,journal:0,kiss:0,
    sleepByDay:[],chargeByDay:[],psychByDay:[],anxByDay:[]
  };
  days.forEach(d => {
    const r=data[dateKey(d)]||{};
    function numStat(key, sKey, cKey, byDay) {
      if(r[key]!==undefined&&r[key]!==''){s[sKey]+=+r[key];s[cKey]++;if(byDay)s[byDay].push(+r[key]);}
      else if(byDay) s[byDay].push(null);
    }
    numStat('sleep','sleepS','sleepC','sleepByDay');
    numStat('charge','chargeS','chargeC','chargeByDay');
    numStat('psych','psychS','psychC','psychByDay');
    numStat('anxiety','anxS','anxC','anxByDay');
    numStat('food','foodS','foodC',null);
    numStat('rational','rationalS','rationalC',null);
    numStat('attention','attentionS','attentionC',null);

    function countHabit(key) {
      if(r[key]==='done') s[key]++;
      else if(r[key]==='half') s[key]+=0.5;
    }
    ['morning','water','workout','baseex','self','network','mindful','planning'].forEach(countHabit);
    ['lateeat','journal','kiss'].forEach(k=>{ if(r[k]==='done') s[k]++; });
  });
  return s;
}

  const MONTH_FULL = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  const monthStats = Array.from({length:12}, (_,mi) => {
    const days = [];
    const last = new Date(year, mi+1, 0).getDate();
    for (let d=1; d<=last; d++) days.push(new Date(year, mi, d));
    const s = getStats(days);
    return {
      charge:  s.chargeC  ? s.chargeS/s.chargeC   : null,
      psych:   s.psychC   ? s.psychS/s.psychC      : null,
      anx:     s.anxC     ? s.anxS/s.anxC           : null,
      sleep:   s.sleepC   ? s.sleepS/s.sleepC       : null,
      morning: s.morning, workout: s.workout, self: s.self,
      journal: s.journal, kiss: s.kiss,
      total: days.length
    };
  });

  // ---- MONTHLY CHARTS ----
  const metrics = [
    { label:'Заряд',        key:'charge', color:'#A3B18A', max:10 },
    { label:'Психол. сост.',key:'psych',  color:'#9ABFD6', max:10 },
    { label:'Тревожность',  key:'anx',    color:'#D8B4A8', max:10 },

    // Y-axis
    chartHtml+='<div style="position:relative;width:24px;flex-shrink:0;height:'+(H+16)+'px">';
    gridLines.forEach(gv=>{
      const bot=Math.round((gv/m.max)*H);
      chartHtml+='<div style="position:absolute;bottom:'+(bot+16-5)+'px;right:2px;font-size:8px;color:var(--text3);font-weight:500;line-height:1">'+gv+'</div>';
    });
    chartHtml+='</div>';
    // Chart body
    chartHtml+='<div style="flex:1;position:relative;height:'+(H+16)+'px">';
    gridLines.forEach(gv=>{
      const bot=Math.round((gv/m.max)*H)+16;
      chartHtml+='<div style="position:absolute;left:0;right:0;bottom:'+bot+'px;height:1px;background:rgba(61,43,31,0.09)"></div>';
    });
    chartHtml+='<div style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;gap:2px;align-items:flex-end;padding-bottom:16px">';
    values.forEach((v,i)=>{
      const h=v!==null?Math.max(Math.round((v/m.max)*H),3):3;
      const op=v!==null?1:0.15;
      chartHtml+='<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%">';
      if(v!==null) chartHtml+='<div style="text-align:center;font-size:7px;font-weight:600;color:var(--choco2);line-height:1;margin-bottom:2px">'+v+'</div>';
      chartHtml+='<div style="height:'+h+'px;background:'+m.color+';opacity:'+op+';border-radius:3px 3px 0 0;transition:opacity 0.2s;cursor:default" '+
        'title="'+MONTH_FULL[i]+': '+(v!==null?v:'нет данных')+'" '+
        'onmouseover="this.style.opacity=\'0.7\'" onmouseout="this.style.opacity=\''+(v!==null?'1':'0.15')+'\'"></div>';
      chartHtml+='</div>';
    });
    chartHtml+='</div>';
    chartHtml+='<div style="position:absolute;left:0;right:0;bottom:0;height:14px;display:flex;gap:2px">';
    MONTH_SHORT.forEach(l=>{
      chartHtml+='<div style="flex:1;text-align:center;font-size:8px;color:var(--choco3);font-weight:300;line-height:14px">'+l+'</div>';
    });

          if(hm.invert){
            // тревожность: 0-3=яркий, 4-7=средний, 8-10=тусклый

            else if(v<=7) tier=1;
            else tier=0;
          } else {
            // заряд/псих: 0-3=тусклый, 4-7=средний, 8-10=яркий

            else if(v<=7) tier=1;
            else tier=2;
          }
          bg=hm.colors[tier];
        }
        const isTodayCell=(dk===dateKey(new Date()));
        heatHtml+='<div style="height:10px;border-radius:2px;background:'+bg+

      }

    heatHtml+='</div>';
    // colour legend
    heatHtml+='<div style="display:flex;align-items:center;gap:6px;margin-top:6px">';

      heatHtml+='<span style="font-size:9px;color:var(--text3)">тревожно</span>';

// ---- RENDER PROGRESS ----
function renderProgress() {
  if (currentPeriod==='year') { renderYear(); return; }

  const days=currentPeriod==='week'?getWeekDates(weekOffset):getMonthDates(weekOffset);
  const s=getStats(days);
  const first=days[0], last=days[days.length-1];
  const daysCount=days.length;

  document.querySelector('.section-title').style.display='';

  if (currentPeriod==='week') {
    document.getElementById('progressPeriodLabel').textContent=
      first.getDate()+' '+MONTH_NAMES[first.getMonth()]+' — '+last.getDate()+' '+MONTH_NAMES[last.getMonth()]+' '+last.getFullYear();
  } else {
    document.getElementById('progressPeriodLabel').textContent=
      MONTH_NAMES[first.getMonth()]+' '+first.getFullYear();
  }

  const labels=days.map(d=>currentPeriod==='week'?DAY_NAMES[d.getDay()]:d.getDate());
  const metrics=[
    { label:'Заряд',       values:s.chargeByDay,  color:'#A3B18A' },
    { label:'Психол. сост.',values:s.psychByDay,  color:'#9ABFD6' },
    { label:'Тревожность', values:s.anxByDay,     color:'#D8B4A8' },
    { label:'Сон (часы)',  values:s.sleepByDay,   color:'#C4B7D8' },
  ];
  let chartHtml='';
  metrics.forEach(m => {
    const maxV=m.label==='Сон (часы)'?12:10;
    const gridLines=m.label==='Сон (часы)'?[0,4,8,12]:[0,3,5,7,10];
    chartHtml+='<div style="margin-bottom:28px">';
    chartHtml+='<div class="chart-metric-label">'+m.label+'</div>';
    // H=60px — bar zone. Grid lines and bars both use same H for bottom offset.
    const H=60;
    chartHtml+='<div style="display:flex;gap:0">';
    // Y-axis labels column
    chartHtml+='<div style="position:relative;width:24px;flex-shrink:0;height:'+(H+16)+'px">';
    gridLines.forEach(gv => {
      const bot=Math.round((gv/maxV)*H);
      chartHtml+='<div style="position:absolute;bottom:'+(bot+16-5)+'px;right:2px;font-size:8px;color:var(--text3);font-weight:500;line-height:1">'+gv+'</div>';
    });
    chartHtml+='</div>';
    // Chart body
    chartHtml+='<div style="flex:1;position:relative;height:'+(H+16)+'px">';
    // grid lines
    gridLines.forEach(gv => {
      const bot=Math.round((gv/maxV)*H)+16;
      chartHtml+='<div style="position:absolute;left:0;right:0;bottom:'+bot+'px;height:1px;background:rgba(61,43,31,0.09)"></div>';
    });
    // bars + day labels row — absolutely fill the container
    chartHtml+='<div style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;gap:3px;align-items:flex-end;padding-bottom:16px">';
    m.values.forEach((v,i) => {
      const h=v!==null?Math.max(Math.round((v/maxV)*H),3):3;
      const op=v!==null?1:0.15;
      chartHtml+='<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%">';
      if(v!==null) chartHtml+='<div style="text-align:center;font-size:8px;font-weight:600;color:var(--choco2);line-height:1;margin-bottom:2px">'+v+'</div>';
      chartHtml+='<div style="height:'+h+'px;background:'+m.color+';opacity:'+op+
        ';border-radius:4px 4px 0 0;transition:opacity 0.2s;cursor:default" '+
        'onmouseover="this.style.opacity=\'0.7\'" onmouseout="this.style.opacity=\''+(v!==null?'1':'0.15')+'\'"></div>';
      chartHtml+='</div>';
    });
    chartHtml+='</div>';
    // day labels pinned to bottom
    chartHtml+='<div style="position:absolute;left:0;right:0;bottom:0;height:14px;display:flex;gap:3px">';
    labels.forEach(l => {
      chartHtml+='<div style="flex:1;text-align:center;font-size:9px;color:var(--choco3);font-weight:300;line-height:14px">'+l+'</div>';
    });
    chartHtml+='</div>';
    chartHtml+='</div></div></div>';
  });
  chartHtml+='<div style="display:flex;gap:14px;margin-top:4px;flex-wrap:wrap">';
  metrics.forEach(m => {
    chartHtml+='<div style="display:flex;align-items:center;gap:5px">'+
      '<div style="width:10px;height:10px;border-radius:3px;background:'+m.color+'"></div>'+
      '<span style="font-size:10px;color:var(--text3);font-weight:300">'+m.label+'</span></div>';
  });
  chartHtml+='</div>';
  document.getElementById('moodChart').innerHTML=chartHtml;

  function avg(s,c) { return c?(s/c).toFixed(1):'-'; }
  function pct(val,max) { return Math.min(Math.round((val/max)*100),100); }

  const habitsData = [
    { label:'Утр. рутина', key:'morning', icon:'🌅', total:daysCount },
    { label:'Тренировка',  key:'workout', icon:'💪', total:daysCount },
    { label:'Саморазвитие',key:'self',    icon:'📚', total:daysCount },
    { label:'Нетворкинг',  key:'network', icon:'🤝', total:daysCount },
    { label:'Осознанность',key:'mindful', icon:'🧘', total:daysCount },
    { label:'Планирование',key:'planning',icon:'📋', total:daysCount },
    { label:'Дневник',     key:'journal', icon:'📓', total:daysCount },
    { label:'Поцелуй',     key:'kiss',    icon:'💋', total:daysCount },
    { label:'Заряд',       key:null,      icon:'⚡', val:avg(s.chargeS,s.chargeC), rawVal:s.chargeC?(s.chargeS/s.chargeC):null, maxVal:10, sub:'среднее' },
    { label:'Психол. сост.',key:null,     icon:'🧠', val:avg(s.psychS,s.psychC),  rawVal:s.psychC?(s.psychS/s.psychC):null,  maxVal:10, sub:'среднее' },
    { label:'Тревожность', key:null,      icon:'😰', val:avg(s.anxS,s.anxC),      rawVal:s.anxC?(s.anxS/s.anxC):null,        maxVal:10, sub:'среднее', invert:true },
    { label:'Сон',         key:null,      icon:'😴', val:avg(s.sleepS,s.sleepC),  rawVal:s.sleepC?(s.sleepS/s.sleepC):null,  maxVal:9,  sub:'ч. среднее' },
  ];

  document.getElementById('habitsGrid').innerHTML = habitsData.map(h => {
    if (h.key) {
      const v = s[h.key];
      const ratio = h.total > 0 ? v / h.total : 0;
      const display = Number.isInteger(v) ? v : v.toFixed(1);
      return chip(h.label, h.icon, display+'/'+h.total, 'дней', ratio, false);
    } else {
      const ratio = h.rawVal !== null ? h.rawVal / h.maxVal : null;
      return chip(h.label, h.icon, h.val, h.sub, ratio, h.invert||false);
    }
  }).join('');
}

function glowStyle(ratio, invert) {
  if (ratio === null) return '';
  const r = invert ? (1 - ratio) : ratio;
  if (r >= 0.7) return 'box-shadow:0 4px 18px rgba(92,150,80,0.38),0 0 0 1.5px rgba(92,150,80,0.18);border-color:rgba(92,150,80,0.25);';
  if (r >= 0.4) return 'box-shadow:0 4px 18px rgba(212,168,50,0.35),0 0 0 1.5px rgba(212,168,50,0.18);border-color:rgba(212,168,50,0.25);';
  return 'box-shadow:0 4px 18px rgba(190,80,60,0.30),0 0 0 1.5px rgba(190,80,60,0.18);border-color:rgba(190,80,60,0.20);';
}

function chip(label, icon, val, sub, ratio, invert) {
  const glow = ratio !== null ? glowStyle(ratio, invert) : '';
  return '<div class="habit-chip" style="'+glow+'">'+
    '<div class="habit-chip-icon">'+icon+'</div>'+
    '<div class="habit-chip-label">'+label+'</div>'+
    '<div class="habit-chip-val">'+val+'</div>'+
    '<div class="habit-chip-sub">'+sub+'</div></div>';
}

// ---- QUICK INPUT ----
const QUICK_PARAMS = PARAMS.filter(p => p.key);
let quickIdx=0, quickDk='';

function openQuick() {
  quickDk=dateKey(new Date());
  quickIdx=0;
  document.getElementById('modalOverlay').classList.remove('hidden');
  renderQuickStep();
}

function closeQuick() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

function renderQuickStep() {
  const total=QUICK_PARAMS.length;
  const p=QUICK_PARAMS[quickIdx];
  const isLast=quickIdx===total-1;

  document.getElementById('modalProgressFill').style.width=Math.round(((quickIdx)/total)*100)+'%';
  document.getElementById('modalStep').textContent=(quickIdx+1)+' / '+total;
  document.getElementById('modalNextBtn').textContent=isLast?'Готово':'Далее';
  document.getElementById('modalLabel').textContent=p.label;

  const existing=data[quickDk]?data[quickDk][p.key]:null;
  let html='';

  if (p.type==='check3') {
    const state=existing||'';
    const yesCls=state==='done'?'selected-yes':'';
    const halfCls=state==='half'?'selected-half':'';
    const skipCls=(!state)?'selected-skip':'';
    html='<div class="modal-check-row">'+
      '<button class="modal-check-btn '+yesCls+'" onclick="quickSetCheck3(\'done\')">Да ✓</button>'+
      '<button class="modal-check-btn '+halfCls+'" onclick="quickSetCheck3(\'half\')">Наполовину ½</button>'+
      '<button class="modal-check-btn '+skipCls+'" onclick="quickSetCheck3(null)">Нет</button>'+
      '</div>';

  } else if (p.type==='check2') {
    const state=existing||'';
    const yesCls=state==='done'?'selected-yes':'';
    const noCls=!state?'selected-skip':'';
    html='<div class="modal-check-row">'+
      '<button class="modal-check-btn '+yesCls+'" onclick="quickSetCheck2(\'done\')">Да ✓</button>'+
      '<button class="modal-check-btn '+noCls+'" onclick="quickSetCheck2(null)">Нет</button>'+
      '</div>';

  } else if (p.type==='num') {
    const v=(existing!==null&&existing!==undefined&&existing!=='')?existing:'';
    html='<div class="modal-num-wrap">'+
      '<input class="modal-num-input" type="number" inputmode="decimal" id="qnInput" min="0" max="'+(p.max||999)+'" step="'+(p.max===10||p.max===24?0.5:1)+'" value="'+v+'" placeholder="'+(p.placeholder||'введи значение')+'">'+
      '</div>';

  } else if (p.type==='valueq') {
    const q=getValueQ(quickDk);
    const stored=existing||'';
    const parts=stored.split('\n---\n');
    const savedA=parts.length>1?parts[1]:'';
    html='<div class="modal-value-q">'+
      '<div class="modal-value-label">Вопрос дня</div>'+
      '<div class="modal-value-qtext">'+q+'</div>'+
      '<textarea class="modal-value-input" id="qvInput" placeholder="твой ответ...">'+savedA+'</textarea>'+
      '</div>';
  }

  document.getElementById('modalInput').innerHTML=html;
}

function quickSetCheck3(val) {
  const p=QUICK_PARAMS[quickIdx];
  if (!data[quickDk]) data[quickDk]={};
  data[quickDk][p.key]=val;
  save(); renderQuickStep();
}

function quickSetCheck2(val) {
  const p=QUICK_PARAMS[quickIdx];
  if (!data[quickDk]) data[quickDk]={};
  data[quickDk][p.key]=val;
  save(); renderQuickStep();
}

function quickSaveCurrentAndAdvance(goForward) {
  const p=QUICK_PARAMS[quickIdx];
  if (!data[quickDk]) data[quickDk]={};

  if (p.type==='num') {
    const inp=document.getElementById('qnInput');
    if (inp&&inp.value!=='') data[quickDk][p.key]=inp.value;
  } else if (p.type==='valueq') {
    const inp=document.getElementById('qvInput');
    if (inp&&inp.value.trim()) {
      const q=getValueQ(quickDk);
      data[quickDk][p.key]=q+'\n---\n'+inp.value.trim();
    }
  }
  save();

  if (goForward) {
    if (quickIdx<QUICK_PARAMS.length-1) { quickIdx++; renderQuickStep(); }
    else { closeQuick(); render(); showToast('День заполнен!'); }
  } else {
    if (quickIdx>0) { quickIdx--; renderQuickStep(); }
  }
}

function quickNext() { quickSaveCurrentAndAdvance(true); }
function quickBack() { quickSaveCurrentAndAdvance(false); }

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target===this) closeQuick();
});

// ---- MAIN RENDER ----
function render() {
  if (currentTab==='progress' && currentPeriod==='year') {
    const year = new Date().getFullYear() + weekOffset;
    document.getElementById('weekLabel').textContent = year + ' год';
    renderProgress();
    return;
  }
  const days=getWeekDates(weekOffset);
  const first=days[0], last=days[6];
  document.getElementById('weekLabel').textContent=
    first.getDate()+' '+MONTH_NAMES[first.getMonth()]+' — '+last.getDate()+' '+MONTH_NAMES[last.getMonth()]+' '+last.getFullYear();

  if (currentTab==='tracker') renderTracker(days);
  else renderProgress();
}

render();
</script>
